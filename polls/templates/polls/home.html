<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добро пожаловать</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --muted: #94a3b8;
            --accent: #38bdf8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, #1d4ed8 0%, transparent 40%),
                radial-gradient(circle at bottom right, #0ea5e9 0%, transparent 35%),
                var(--bg);
        }

        main {
            width: min(90vw, 520px);
            padding: 2.5rem;
            border-radius: 1rem;
            background: color-mix(in srgb, var(--card) 88%, transparent);
            border: 1px solid color-mix(in srgb, white 12%, transparent);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
            text-align: center;
        }

        h1 {
            margin: 0 0 0.75rem;
            font-size: clamp(1.8rem, 4vw, 2.4rem);
            font-weight: 700;
        }

        p {
            margin: 0;
            color: var(--muted);
            font-size: 1.1rem;
            line-height: 1.6;
        }
        .accent {
            color: var(--accent);
        }
    </style>
</head>
<body>
    <main>
        <h1>Привет! <span class="accent">Добро пожаловать</span></h1>
        <p>Стартовая страница Django-проекта работает корректно.</p>
    </main>
</body>
</html>
